name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK and project
        run: python -m pip install ./contest-harness-sdk-1.0.5.tar.gz -e ".[dev]"
      - name: Unit, protocol and member tests
        env:
          ZHIXUN_GIT_COMMIT: ${{ github.sha }}
          ZHIXUN_RUN_PROVENANCE: ci
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK for the host side of the acceptance tests
        run: python -m pip install ./contest-harness-sdk-1.0.5.tar.gz -e ".[dev]"
      - name: Build image with the commit recorded
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t zhixun-harness:ci .
      - name: Image acceptance (offline, read-only, non-root, A/B/C predict, rounds, SIGTERM)
        run: bash scripts/verify_image.sh zhixun-harness:ci
